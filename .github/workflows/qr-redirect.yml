name: QR Redirect

on:
  push:
    paths:
      - "qr-redirect/**"
      - "phpcs.shared.xml"
      - ".github/workflows/qr-redirect.yml"
  pull_request:
    paths:
      - "qr-redirect/**"
      - "phpcs.shared.xml"
      - ".github/workflows/qr-redirect.yml"

permissions:
  contents: read

jobs:
  verify:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.2", "8.4", "8.5"]

    defaults:
      run:
        working-directory: qr-redirect

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run standalone test suites
        run: composer test

      - name: Enforce coding standards
        run: composer lint

      - name: Check PHP syntax
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
